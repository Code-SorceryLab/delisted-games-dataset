<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKVG Project</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Landing page: the dataset and the pipeline map as two tabs. Each page is
   loaded unchanged in its own frame, so their styles stay separate. */
:root {
  --paper: #fbfbfa; --sheet: #ffffff; --ink: #111418; --muted: #5f6670; --rule: #d9dcdf;
  --accent: #2458b3; --on-accent: #ffffff; --code-bg: #f0f1f2;
  --sans: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121417; --sheet: #191c20; --ink: #e8eaed; --muted: #9aa1aa; --rule: #30353b;
    --accent: #86acef; --on-accent: #121417; --code-bg: #22262b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121417; --sheet: #191c20; --ink: #e8eaed; --muted: #9aa1aa; --rule: #30353b;
  --accent: #86acef; --on-accent: #121417; --code-bg: #22262b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 15px/1.4 var(--sans); }
.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 10px 20px;
       background: var(--sheet); border-bottom: 1px solid var(--rule); flex: none; }
.brand { font-weight: 600; letter-spacing: .02em; color: var(--muted); }
/* Segmented switch: the open view is filled with the accent colour. */
.tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 10px; }
.tab { display: inline-flex; align-items: center; gap: 8px; font: 600 1rem/1 var(--sans); color: var(--muted);
       background: none; border: 0; border-radius: 7px; padding: 9px 20px; cursor: pointer; transition: background .15s, color .15s; }
.tab svg { width: 18px; height: 18px; flex: none; }
.tab:hover { color: var(--ink); background: var(--sheet); }
.tab[aria-selected="true"] { color: var(--on-accent); background: var(--accent); box-shadow: 0 1px 3px rgb(0 0 0 / .18); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.views { position: relative; flex: 1; min-height: 0; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
iframe[hidden] { display: none; }
@media (max-width: 560px) { .bar { grid-template-columns: 1fr; justify-items: center; padding: 8px 16px; } .brand { display: none; } }
@media (prefers-reduced-motion: reduce) { .tab { transition: none; } }
</style>
</head>
<body>
<nav class="bar">
  <span class="brand">SKVG Project</span>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-dataset" aria-controls="view-dataset" data-view="dataset">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="1.5"/><path d="M2.5 8H17.5M2.5 12.25H17.5M8 8V16.5"/></svg>Dataset</button>
    <button class="tab" role="tab" id="tab-pipeline" aria-controls="view-pipeline" data-view="pipeline">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="4" cy="10" r="2.2"/><circle cx="16" cy="4.5" r="2.2"/><circle cx="16" cy="15.5" r="2.2"/><path d="M6.2 10H10M10 4.5V15.5M10 4.5H13.8M10 15.5H13.8"/></svg>Pipeline</button>
  </div>
  <span></span>
</nav>
<div class="views">
  <iframe id="view-dataset" role="tabpanel" aria-labelledby="tab-dataset" title="Dataset" data-src="dataset/index.html" hidden></iframe>
  <iframe id="view-pipeline" role="tabpanel" aria-labelledby="tab-pipeline" title="Pipeline map" data-src="pipeline.html" hidden></iframe>
</div>
<script>
const VIEWS = ["dataset", "pipeline"];
const tabs = document.querySelectorAll(".tab");

function show(view) {
  if (!VIEWS.includes(view)) view = VIEWS[0];
  for (const v of VIEWS) {
    const frame = document.getElementById("view-" + v);
    const on = v === view;
    // Each page loads the first time its tab is opened, then keeps its state.
    if (on && !frame.src) frame.src = frame.dataset.src;
    frame.hidden = !on;
    document.getElementById("tab-" + v).setAttribute("aria-selected", on);
  }
  if (location.hash.slice(1) !== view) history.replaceState(null, "", "#" + view);
}

tabs.forEach(t => t.addEventListener("click", () => show(t.dataset.view)));
document.querySelector(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = [...tabs].indexOf(document.activeElement);
  const next = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
  next.focus();
  show(next.dataset.view);
});
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
</html>
